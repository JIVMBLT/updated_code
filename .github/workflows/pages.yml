name: Deploy LAB DGB to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Validate and package LAB DGB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Generate deployed version metadata
        run: node tools/generate-build-info.js

      - name: Run LAB integrated regression tests
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r test; do
            echo "> node $test"
            node "$test"
          done < <(find tests -maxdepth 1 -type f -name 'lab_*.cjs' ! -name '*package_guard*' | sort)

          while IFS= read -r test; do
            echo "> python3 $test"
            python3 "$test"
          done < <(find tests -maxdepth 1 -type f -name 'lab_*.py' | sort)

      - name: Validate integrated LAB structure
        shell: bash
        run: |
          set -euo pipefail

          test -f index.html
          test -f manifest.json
          test -f core/config.js
          test -f core/data-sync.js
          test -f core/push-notifications.js
          test -f lab/index.html
          test -f lab/database/schema.sql
          test -f lab/database/seed.sql
          test -f lab/vendor/sql.js/1.14.2/sql-wasm.js
          test -f lab/vendor/sql.js/1.14.2/sql-wasm.wasm

          test ! -d backend
          test ! -d database
          test ! -d sql
          test ! -d validation

          if find . -type f             \( -name '*.patch' -o -name '*.diff' -o -name 'APPLY_*' -o -name 'APLICAR_*' \)             -not -path './.git/*' | grep -q .; then
            echo 'ERROR: se encontraron artefactos prohibidos (.patch/.diff/APPLY_/APLICAR_).'
            exit 1
          fi

      - name: Build GitHub Pages artifact
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _site
          mkdir -p _site

          cp index.html _site/index.html
          cp manifest.json _site/manifest.json
          cp -R assets _site/assets
          cp -R core _site/core
          cp -R modules _site/modules
          cp -R styles _site/styles
          cp -R lab _site/lab

          touch _site/.nojekyll

          test -f _site/index.html
          test -f _site/manifest.json
          test -f _site/core/config.js
          test -f _site/core/build-info.generated.js
          test -f _site/lab/index.html
          test -f _site/lab/database/schema.sql
          test -f _site/lab/database/seed.sql
          test -f _site/lab/vendor/sql.js/1.14.2/sql-wasm.js
          test -f _site/lab/vendor/sql.js/1.14.2/sql-wasm.wasm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    name: Deploy LAB DGB
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
